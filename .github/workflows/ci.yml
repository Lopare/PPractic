name: CI Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t ppractica-app:ci-test .
      
      - name: Verify Image
        run: docker image inspect ppractica-app:ci-test
      
      - name: Clean up
        run: docker rmi ppractica-app:ci-test